# .github/workflows/i18n.yml
#
# Runs Intlayer's AI translation fill on every push to main.
# Any missing keys in pa.json / hi.json are auto-translated and
# committed back to the repo, keeping translations always complete.
#
# Provider options (set the corresponding secret in GitHub):
#   OpenAI    — OPENAI_API_KEY
#   Anthropic — ANTHROPIC_API_KEY
#   Ollama    — no key needed (runs locally, slower on CI)

name: i18n — Auto-fill missing translations

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/i18n/en.json"   # trigger only when English source changes

permissions:
  contents: write

jobs:
  fill-translations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Fill missing translations (Anthropic Claude)
        run: npm run i18n:fill:anthropic
        working-directory: frontend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Override to use OpenAI instead:
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Test — fail CI if any key is still missing
        run: npm run i18n:test
        working-directory: frontend

      - name: Commit updated translations
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(i18n): auto-fill missing translations [skip ci]"
          file_pattern: "frontend/src/i18n/*.json"
